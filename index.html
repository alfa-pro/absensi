<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}body{font-family:Inter,system-ui,sans-serif;background:#f9fafb;color:#1f2937}
.nav.on{background:#eff6ff;color:#2563eb;font-weight:600}
.inp{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;background:#fff}
.btn{padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;color:#fff;background:#2563eb}
.th{padding:.75rem 1.25rem;text-align:left;font-size:.7rem;text-transform:uppercase;color:#6b7280}
.td{padding:.75rem 1.25rem;font-size:.875rem;white-space:nowrap}

body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff 0%,#f8fafc 50%,#fdf4ff 100%);background-attachment:fixed;color:#1e1b4b}
.login-bg{background:radial-gradient(circle at 15% 20%,#818cf8 0,transparent 40%),radial-gradient(circle at 85% 80%,#f0abfc 0,transparent 40%),linear-gradient(135deg,#312e81,#4f46e5 60%,#7c3aed)}
.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.6);box-shadow:0 25px 60px rgba(30,27,75,.35)}
.logo{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.45)}
aside{background:linear-gradient(180deg,#1e1b4b 0%,#312e81 100%)!important;border:0!important;color:#fff}
aside .border-b{border-color:rgba(255,255,255,.1)!important}
aside p{color:#fff}aside #ur{color:#c7d2fe}
aside .nav{color:#c7d2fe;transition:.2s;margin-bottom:2px}
aside .nav:hover{background:rgba(255,255,255,.1)!important;color:#fff}
aside .nav.on{background:linear-gradient(90deg,rgba(129,140,248,.5),rgba(167,139,250,.15))!important;color:#fff!important;box-shadow:inset 3px 0 0 #a5b4fc}
aside>button{color:#fca5a5}aside>button:hover{background:rgba(248,113,113,.15)!important}
#ui{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
main h2{font-weight:800;letter-spacing:-.02em;color:#1e1b4b}
main>*{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#toast>div{animation:in .3s ease;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.bg-white.rounded-xl,.bg-white.rounded-2xl{border:1px solid #eef0f8!important;box-shadow:0 6px 24px rgba(79,70,229,.07);border-radius:1rem}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 6px 16px rgba(99,102,241,.35);transition:.2s;border-radius:.75rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(99,102,241,.45)}
.inp{border-radius:.75rem;border:1.5px solid #e0e7ff;transition:.2s}
.inp:focus{outline:0;border-color:#818cf8;box-shadow:0 0 0 4px rgba(129,140,248,.2)}
.p-5.bg-blue-600{background:linear-gradient(135deg,#4f46e5,#7c3aed,#c026d3)}
thead.bg-gray-50{background:linear-gradient(90deg,#eef2ff,#faf5ff)}
.th{color:#6366f1;font-weight:700}
tbody tr:hover{background:#f5f3ff}
.stat{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-3px)}
.stat .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.stat b{font-size:2rem;font-weight:800;line-height:1.1}
.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
.tabb{padding:.5rem 1.1rem;border-radius:999px;font-size:.875rem;font-weight:600;border:1.5px solid #e0e7ff;background:#fff;color:#6366f1;transition:.2s}.tabb.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.35)}
#app.kiosk aside{display:none}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#d946ef);box-shadow:0 20px 40px rgba(99,102,241,.35);position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:after{content:'';position:absolute;right:120px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.vf{position:relative;width:100%;max-width:340px;aspect-ratio:1;border-radius:24px;background:#0f172a;overflow:hidden;box-shadow:0 18px 40px rgba(15,23,42,.35)}
.vf #reader{position:absolute;inset:0;width:100%;height:100%;border:0!important}.vf #reader video{object-fit:cover}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#94a3b8;font-size:.85rem;background:radial-gradient(circle at 50% 40%,#1e293b,#0f172a)}
#reader:not(.hidden)+#ph{display:none}
.vf i{position:absolute;width:40px;height:40px;border:4px solid #a5b4fc;z-index:5;pointer-events:none}
.c1{top:16px;left:16px;border-right:0;border-bottom:0;border-top-left-radius:14px}.c2{top:16px;right:16px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.c3{bottom:16px;left:16px;border-right:0;border-top:0;border-bottom-left-radius:14px}.c4{bottom:16px;right:16px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.sl{position:absolute;left:12%;right:12%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#a5b4fc,transparent);box-shadow:0 0 14px #818cf8;z-index:5;pointer-events:none;animation:scanl 2.4s ease-in-out infinite}
@keyframes scanl{0%,100%{top:14%}50%{top:84%}}
.res{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px;border:1.5px solid}
.res.ok{background:#ecfdf5;border-color:#a7f3d0}.res.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c;font-weight:600}
.avl,.av{background:linear-gradient(135deg,#6366f1,#d946ef);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.avl{width:60px;height:60px;border-radius:18px;font-size:26px}.av{width:40px;height:40px;border-radius:12px;font-size:16px}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;margin-right:8px;animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.3;transform:scale(1.6)}}
.ic2{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.big{font-size:1.35rem!important;font-weight:800;letter-spacing:.15em;text-align:center}
.res.warn{background:#fffbeb;border-color:#fde68a}
</style></head>
<body>
<div id="toast" class="fixed top-4 right-4 z-[999] space-y-2"></div>

<div id="auth" class="h-full flex items-center justify-center login-bg p-4">
 <div class="glass p-8 rounded-3xl w-full max-w-md">
  <div class="text-center mb-6"><div id="bl" class="logo mx-auto mb-3" style="width:68px;height:68px;font-size:32px;border-radius:22px">📷</div><h1 id="bn" class="text-2xl font-extrabold"></h1><p id="bt" class="text-sm text-gray-500"></p></div>
  <form id="lf" class="space-y-4">
   <input id="em" type="email" required class="inp" placeholder="admin@sekolah.com">
   <input id="pw" type="password" required class="inp" placeholder="Password">
   <button class="btn w-full py-3 text-base">Masuk ke Sistem →</button>
  </form>
  <div class="mt-5 p-3 bg-blue-50 rounded-lg text-xs text-blue-800"><b>Info Testing:</b><br>Admin: admin@sekolah.com / admin<br>Guru: guru@sekolah.com / guru</div>
 </div>
</div>

<div id="app" class="hidden h-full flex flex-col md:flex-row">
 <aside class="md:w-60 bg-white border-r flex-shrink-0 flex flex-col">
  <div class="h-16 flex items-center gap-3 px-5 border-b font-extrabold text-lg"><div class="logo" id="sl"></div><div class="min-w-0 leading-tight"><div id="sn2" class="truncate"></div><div id="st2" class="text-[10px] font-medium truncate" style="color:#a5b4fc"></div></div></div>
  <div class="p-4 border-b flex items-center gap-3"><div id="ui"></div><div class="min-w-0"><p id="un" class="text-sm font-semibold truncate"></p><p id="ur" class="text-xs"></p></div></div>
  <nav id="nav" class="flex md:block md:flex-1 overflow-x-auto p-2 gap-1"></nav>
  <button onclick="logout()" class="m-3 text-left px-3 py-2 text-sm text-red-600 rounded-lg hover:bg-red-50">⎋ Keluar</button>
 </aside>
 <main id="main" class="flex-1 overflow-y-auto p-4 md:p-8"></main>
</div>

<div id="modal" class="hidden fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4">
 <div class="bg-white rounded-xl w-full max-w-md overflow-hidden">
  <div class="px-5 py-3 border-b bg-gray-50 font-bold" id="mt"></div>
  <div class="p-5 space-y-3" id="mb"></div>
  <div class="px-5 py-3 border-t bg-gray-50 flex justify-end gap-2">
   <button onclick="closeM()" class="px-4 py-2 border rounded-lg text-sm">Batal</button>
   <button id="ms" class="btn">Simpan</button></div>
 </div>
</div>

<script>
const mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},
 set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const users=[{email:'admin@sekolah.com',password:'admin',name:'Budi Admin',role:'admin'},{email:'guru@sekolah.com',password:'guru',name:'Siti Guru',role:'guru'}];
let kelas=S.get('kelas',[{id:'k1',nama:'X MIPA 1'},{id:'k2',nama:'X IPS 1'}]);
let siswa=S.get('siswa',[
 {id:'s1',nis:'1001',nama:'Ahmad Fauzi',kelasId:'k1',noWa:'081234567890',ortu:'Bpk. Herman'},
 {id:'s2',nis:'1002',nama:'Bunga Lestari',kelasId:'k1',noWa:'089876543210',ortu:'Ibu Ratna'},
 {id:'s3',nis:'1003',nama:'Candra Wijaya',kelasId:'k2',noWa:'085555555555',ortu:'Bpk. Wijaya'}]);
let riwayat=S.get('riwayat',[]);
let cfg=Object.assign({url:'https://tp4.wapromosi.my.id',apikey:'',sender:'',sekolah:'SMA Negeri 1 Nusantara',tpl:'Yth. Bapak/Ibu [ORTU], ananda [NAMA] (NIS: [NIS], Kelas: [KELAS]) telah HADIR di [SEKOLAH] pada [TANGGAL] pukul [WAKTU]. Terima kasih.'},S.get('cfg',{}));
const MIG={'[Nama Ortu]':'[ORTU]','[Nama Siswa]':'[NAMA]','[Nama Sekolah]':'[SEKOLAH]','[Kelas]':'[KELAS]','[Tanggal]':'[TANGGAL]','[Waktu]':'[WAKTU]'};Object.keys(MIG).forEach(k=>{cfg.tpl=cfg.tpl.split(k).join(MIG[k])});
const BRAND0={name:'AbsenSmart',tagline:'Sistem Kehadiran Cerdas',logo:'📷',logoImg:''};
let brand=Object.assign({},BRAND0,S.get('brand',{}));
let kiosk=false;try{kiosk=location.hash==='#scan'}catch(e){}
let logs=[],user=null,view='',tab='siswa',chart=null;
const kn=id=>(kelas.find(k=>k.id===id)||{}).nama||'-';
const today=()=>new Date().toLocaleDateString('id-ID');
function toast(m,t='info'){const e=document.createElement('div');e.className='px-4 py-2 rounded-lg text-white text-sm shadow '+({success:'bg-emerald-500',error:'bg-red-500',info:'bg-blue-500'}[t]);e.textContent=m;$('toast').appendChild(e);setTimeout(()=>e.remove(),3500)}

$('lf').onsubmit=e=>{e.preventDefault();const u=users.find(x=>x.email===$('em').value&&x.password===$('pw').value);
 if(!u)return toast('Email atau password salah.','error');user=u;S.set('sess',u);boot();toast('Selamat datang, '+u.name+'!','success')};
function boot(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');
 $('un').textContent=user.name;$('ui').textContent=user.name[0].toUpperCase();$('ur').textContent=user.role==='admin'?'Administrator':'Guru / Operator';
 const items=[['dashboard','📊 Dashboard',['admin']],['scan','🔍 Scan Absensi',['admin','guru']],['rekap','📄 Rekap Absensi',['admin']],['master','🗄 Data Master',['admin']],['settings','⚙️ Pengaturan',['admin']]];
 $('nav').innerHTML=items.filter(i=>i[2].includes(user.role)).map(i=>`<a href="#" data-v="${i[0]}" class="nav whitespace-nowrap block px-3 py-2 rounded-lg text-sm hover:bg-blue-50" onclick="nav('${i[0]}');return false">${i[1]}</a>`).join('');
 kiosk=kiosk||user.role==='guru';$('app').classList.toggle('kiosk',kiosk);go(kiosk?'scan':'dashboard')}
function logout(){user=null;S.set('sess',null);$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
let qr=null,camOn=false,camBusy=false;
function camBtn(on){const b=$('bc');if(!b)return;b.textContent=on?'⏹ Matikan Kamera':'📷 Aktifkan Kamera Scanner';b.className='px-5 py-2.5 rounded-lg text-sm font-semibold border '+(on?'bg-red-50 text-red-600 border-red-200':'bg-blue-50 text-blue-600 border-blue-200')}
async function toggleCam(){camOn?await stopCam():await startCam()}
async function startCam(){const rd=$('reader'),er=$('cerr');if(camBusy)return;
 if(!window.Html5Qrcode){er.textContent='Library scanner belum termuat.';er.classList.remove('hidden');return}
 camBusy=true;er.classList.add('hidden');rd.classList.remove('hidden');$('bc').textContent='Meminta akses kamera...';
 try{qr=qr||new Html5Qrcode('reader');
  await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},txt=>{
   try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=800;o.start();o.stop(c.currentTime+.1)}catch(e){}
   const i=$('si');if(i&&!i.disabled){i.value=txt;window.runScan&&window.runScan(txt)}},()=>{});
  camOn=true;camBtn(true)
 }catch(e){rd.classList.add('hidden');camOn=false;camBtn(false);
  er.textContent='Kamera tidak bisa diakses ('+(e&&e.message||e)+'). Izinkan akses kamera di browser; di preview ini kamera bisa diblokir, jalankan di hosting HTTPS sendiri.';er.classList.remove('hidden')}
 camBusy=false}
async function stopCam(){try{if(qr&&camOn)await qr.stop()}catch(e){}camOn=false;const rd=$('reader');if(rd)rd.classList.add('hidden');camBtn(false)}
function nav(v){v==='scan'?openScan():go(v)}
function openScan(){let w=null;try{w=window.open(location.href.split('#')[0]+'#scan','_blank')}catch(e){}
 if(!w){toast('Tab baru diblokir, mode scan dibuka di tab ini.','info');setKiosk(true)}}
function setKiosk(on){kiosk=on;$('app').classList.toggle('kiosk',on);go(on?'scan':'dashboard')}
function kbar(){return `<div class="max-w-5xl mx-auto flex items-center justify-between mb-5 flex-wrap gap-3"><div class="flex items-center gap-3"><div class="logo" id="kl"></div><div class="leading-tight"><div class="font-extrabold" id="kn"></div><div class="text-xs text-gray-500" id="kt"></div></div></div><div class="flex gap-2">${user.role==='admin'?'<button class="tabb" onclick="setKiosk(false)">← Menu Utama</button>':''}<button class="tabb" onclick="logout()">Keluar</button></div></div>`}
function go(v){riwayat=S.get('riwayat',riwayat);siswa=S.get('siswa',siswa);kelas=S.get('kelas',kelas);if(v!=='scan')stopCam();view=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));({dashboard,scan,rekap,master,settings})[v]()}

function dashboard(){
 const t=today(),set=new Set(riwayat.filter(a=>a.tanggal===t).map(a=>a.nis));
 const belum=siswa.filter(s=>!set.has(s.nis));
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 const data=days.map(d=>riwayat.filter(a=>a.tanggal===d.toLocaleDateString('id-ID')).length);
 const card=(l,v,i,g)=>`<div class="stat bg-white rounded-xl"><div><p class="text-sm text-gray-500 font-medium">${l}</p><b>${v}</b></div><div class="ic" style="background:${g}">${i}</div></div>`;
 $('main').innerHTML=`<h2 class="text-2xl font-bold mb-5">Dashboard</h2>
 <div class="grid md:grid-cols-3 gap-4 mb-6">${card('Total Siswa',siswa.length,'👥','linear-gradient(135deg,#6366f1,#8b5cf6)')}${card('Hadir Hari Ini',set.size,'✅','linear-gradient(135deg,#10b981,#34d399)')}${card('Belum Absen',belum.length,'⏳','linear-gradient(135deg,#f43f5e,#fb923c)')}</div>
 <div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-white rounded-xl border p-4"><h3 class="font-semibold mb-3">Tren Kehadiran 7 Hari Terakhir</h3><div class="h-64"><canvas id="ch"></canvas></div></div>
 <div class="bg-white rounded-xl border overflow-hidden"><div class="p-3 border-b bg-gray-50 font-semibold flex justify-between">Belum Absen Hari Ini<span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded-full">${belum.length} Siswa</span></div>
 <ul class="divide-y max-h-64 overflow-y-auto">${belum.map(s=>`<li class="p-3 text-sm flex justify-between"><span>${s.nama}</span><span class="text-xs bg-gray-100 px-2 rounded">${kn(s.kelasId)}</span></li>`).join('')||'<li class="p-4 text-center text-sm text-green-600">Semua siswa sudah diabsen.</li>'}</ul></div></div>`;
 if(window.Chart){if(chart)chart.destroy();chart=new Chart($('ch'),{type:'line',data:{labels:days.map(d=>d.toLocaleDateString('id-ID',{weekday:'short'})),datasets:[{label:'Hadir',data,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.15)',fill:true,pointBackgroundColor:'#fff',pointBorderWidth:2,tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}}

let clkT=null;
function tick(){const c=$('clk');if(!c){clearInterval(clkT);return}const d=new Date();c.textContent=d.toLocaleTimeString('id-ID',{hour12:false}).replace(/\./g,':');$('dt').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
const idle=()=>'<div class="text-center py-4 text-gray-400 text-sm"><span class="pulse"></span>Siap memindai...</div>';
function recent(){const t=today(),all=riwayat.filter(a=>a.tanggal===t),set=new Set(all.map(a=>a.nis)),r=all.slice(-15).reverse();
 const h=set.size,tot=siswa.length;if($('sh')){$('sh').textContent=h;$('sb').textContent=Math.max(tot-h,0);$('pb').style.width=(tot?Math.min(100,Math.round(h/tot*100)):0)+'%';$('pc').textContent=(tot?Math.round(h/tot*100):0)+'% hadir ('+h+'/'+tot+')'}
 $('rc').innerHTML=r.map(x=>`<li class="p-3 flex items-center gap-3"><div class="av">${(x.nama||'?')[0]}</div><div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${x.nama}</div><div class="text-[11px] text-gray-500 truncate">${kn(x.kelasId)} • NIS ${x.nis}</div></div><div class="text-right"><div class="text-xs font-bold text-emerald-600">✓ Hadir</div><div class="text-[11px] text-gray-400">${x.waktu}</div></div></li>`).join('')||'<li class="p-8 text-center text-sm text-gray-400"><div class="text-3xl mb-1 opacity-50">🗒️</div>Belum ada absensi hari ini.</li>'}
function scan(){
 $('main').innerHTML=(kiosk?kbar():'')+`<div class="max-w-5xl mx-auto">
 <div class="hero rounded-3xl p-6 mb-5 text-white flex flex-wrap items-center justify-between gap-4"><div><div class="text-xs uppercase tracking-widest opacity-80">Absensi Kehadiran</div><h2 class="text-3xl font-extrabold" style="color:#fff">Scan Absensi</h2><p class="text-sm opacity-80 mt-1">Arahkan QR / barcode siswa ke kamera atau ketik NIS</p></div>
 <div class="text-right"><div id="clk" class="text-4xl font-extrabold tabular-nums">--:--:--</div><div id="dt" class="text-sm opacity-80"></div></div></div>
 <div class="grid lg:grid-cols-12 gap-5"><div class="lg:col-span-7"><div class="bg-white rounded-2xl p-5">

let csp=false;document.addEventListener('securitypolicyviolation',()=>{csp=true});
function fillTpl(t,s,tgl,wkt){const v={NAMA:s.nama,ORTU:s.ortu,NIS:s.nis,KELAS:kn(s.kelasId),SEKOLAH:cfg.sekolah,TANGGAL:tgl,WAKTU:wkt};return t.replace(/\[(NAMA|ORTU|NIS|KELAS|SEKOLAH|TANGGAL|WAKTU)\]/gi,(m,k)=>v[k.toUpperCase()])}
function normNo(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
async function kirimWA(to,pesan){const waktu=new Date().toLocaleTimeString('id-ID'),no=normNo(to);
 const log=(status,res)=>logs.unshift({waktu,to:no||to,status,pesan,res});
 if(!cfg.apikey||!cfg.sender){log('Gagal','API Key / nomor sender (device) belum diisi.');return{ok:false,msg:'API Key / Sender belum diisi'}}
 if(!no){log('Gagal','Nomor WA tujuan kosong.');return{ok:false,msg:'Nomor tujuan kosong'}}
 try{const f=new FormData();f.append('api_key',cfg.apikey);f.append('sender',normNo(cfg.sender));f.append('number',no);f.append('message',pesan);
  csp=false;const r=await fetch(cfg.url.replace(/[/]+$/,'')+'/send-message',{method:'POST',body:f}),t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  const st=j?String(j.status).toLowerCase():'';
  const ok=j?(st==='true'||st==='1'||st==='success'||(st!=='false'&&st!=='0'&&st!=='error'&&st!=='failed'&&st!=='undefined'&&r.ok)):r.ok;
  log(ok?'Terkirim':'Gagal',t.slice(0,300));return{ok,msg:(j&&(j.msg||j.message))||t.slice(0,100)}
 }catch(e){
  if(!csp){log('Terkirim','Permintaan terkirim ke server, tetapi respons tidak terbaca browser (CORS). Cek WA tujuan untuk memastikan. Detail: '+e.message);return{ok:true,msg:'Terkirim (respons tidak terbaca/CORS)'}}
  log('Error','Diblokir oleh preview (CSP), pesan tidak terkirim: '+e.message);return{ok:false,msg:'Diblokir preview'}}}

const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function matrix(){const k=$('fk').value,b=$('fb').value||new Date().toISOString().slice(0,7);
 const [Y,M]=b.split('-').map(Number),n=new Date(Y,M,0).getDate();
 const hadir={};riwayat.forEach(r=>{const p=String(r.tanggal).split('/').map(Number);if(p[2]===Y&&p[1]===M)(hadir[r.nis]=hadir[r.nis]||new Set()).add(p[0])});
 const list=siswa.filter(s=>k==='all'||s.kelasId===k).sort((x,y)=>x.nama.localeCompare(y.nama));
 return{Y,M,n,list,hadir,k}}

function exportX(){const m=matrix();if(!m.list.length)return toast('Tidak ada data yang bisa diexport!','error');
 if(!window.XLSX)return toast('Library Excel belum termuat.','error');
 const hd=['No','NIS','Nama Siswa',...Array.from({length:m.n},(_,i)=>i+1),'Total Hadir'];
 const aoa=[[`Kelas: ${m.k==='all'?'Semua Kelas':kn(m.k)}`],[`Bulan: ${BLN[m.M-1]} ${m.Y}`],[],hd,...m.list.map((s,i)=>{const set=m.hadir[s.nis]||new Set();return[i+1,s.nis,s.nama,...Array.from({length:m.n},(_,d)=>set.has(d+1)?'H':''),set.size]})];
 const ws=XLSX.utils.aoa_to_sheet(aoa),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rekap_Absensi');
 try{XLSX.writeFile(wb,`Rekap_Absensi_${BLN[m.M-1]}_${m.Y}.xlsx`);toast('File Excel diunduh.','success')}catch(e){toast('Unduhan dibatasi di preview.','info')}}

 $('lgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{const im=new Image();im.onload=()=>{const z=160,c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d'),m=Math.min(im.width,im.height);
   x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);draft.logoImg=c.toDataURL('image/png');prev()};im.onerror=()=>toast('File gambar tidak valid.','error');im.src=ev.target.result};r.readAsDataURL(f);e.target.value=''}}
function prev(){['pl','lp','pl2'].forEach(i=>setLogo($(i),draft));$('pn').textContent=$('pn2').textContent=draft.name||'Nama Aplikasi';$('pt').textContent=$('pt2').textContent=draft.tagline||''}
function saveBrand(){if(!draft.name.trim())return toast('Nama aplikasi wajib diisi!','error');brand=Object.assign({},draft,{name:draft.name.trim(),tagline:draft.tagline.trim()});S.set('brand',brand);applyBrand();toast('Pengaturan aplikasi berhasil disimpan!','success')}
function resetBrand(){draft=Object.assign({},BRAND0);appPanel();toast('Dikembalikan ke default. Klik Simpan untuk menerapkan.','info')}
function lg(){$('lg').innerHTML=logs.map(l=>`<li class="p-3"><div class="flex justify-between text-xs"><span class="text-gray-500">${l.waktu}</span><span class="px-2 rounded ${l.status==='Terkirim'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${l.status}</span></div><p class="text-sm font-medium">Kepada: ${l.to}</p><p class="text-xs italic bg-gray-100 p-2 rounded my-1">${l.pesan}</p><p class="text-[10px] text-gray-400 break-words">${l.res}</p></li>`).join('')||'<li class="p-6 text-center text-sm text-gray-500">Belum ada log pengiriman.</li>'}
function simpan(){cfg={url:$('su').value.trim()||'https://tp4.wapromosi.my.id',apikey:$('st').value.trim(),sender:$('sn').value.trim(),sekolah:$('ss').value,tpl:$('sp').value};S.set('cfg',cfg);toast('Pengaturan berhasil disimpan!','success')}
async function tes(){const n=$('tn').value.trim();if(!n)return toast('Masukkan nomor WA tujuan.','error');cfg.url=$('su').value.trim()||cfg.url;cfg.apikey=$('st').value.trim();cfg.sender=$('sn').value.trim();cfg.sekolah=$('ss').value;
 const r=await kirimWA(n,`Ini pesan uji dari sistem absensi ${cfg.sekolah}.`);toast(r.ok?'Berhasil terkirim!':'Gagal: '+r.msg,r.ok?'success':'error');lg()}
applyBrand();
const sess=S.get('sess',null);if(sess&&sess.email){user=sess;boot()}
</script></body></html>
