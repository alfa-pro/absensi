<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplikasi Absensi Siswa WA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}body{font-family:Inter,system-ui,sans-serif;background:#f9fafb;color:#1f2937}
.nav.on{background:#eff6ff;color:#2563eb;font-weight:600}
.inp{width:100%;border:1px solid #d1d5db;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;background:#fff}
.btn{padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;color:#fff;background:#2563eb}
.th{padding:.75rem 1.25rem;text-align:left;font-size:.7rem;text-transform:uppercase;color:#6b7280}
.td{padding:.75rem 1.25rem;font-size:.875rem;white-space:nowrap}
</style></head>
<body>
<div id="toast" class="fixed top-4 right-4 z-[999] space-y-2"></div>

<div id="auth" class="h-full flex items-center justify-center bg-blue-50 p-4">
 <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
  <div class="text-center mb-6"><div class="text-4xl mb-2">📷</div><h1 class="text-2xl font-bold">Absensi WA</h1><p class="text-sm text-gray-500">Sistem Kehadiran Cerdas</p></div>
  <form id="lf" class="space-y-4">
   <input id="em" type="email" required class="inp" placeholder="admin@sekolah.com">
   <input id="pw" type="password" required class="inp" placeholder="Password">
   <button class="btn w-full py-2.5">Masuk ke Sistem</button>
  </form>
  <div class="mt-5 p-3 bg-blue-50 rounded-lg text-xs text-blue-800"><b>Info Testing:</b><br>Admin: admin@sekolah.com / admin<br>Guru: guru@sekolah.com / guru</div>
 </div>
</div>

<div id="app" class="hidden h-full flex flex-col md:flex-row">
 <aside class="md:w-60 bg-white border-r flex-shrink-0 flex flex-col">
  <div class="h-14 flex items-center px-5 border-b font-bold text-lg">Absen<span class="text-blue-600">Smart</span></div>
  <div class="p-4 border-b"><p id="un" class="text-sm font-semibold"></p><p id="ur" class="text-xs text-gray-500"></p></div>
  <nav id="nav" class="flex md:block md:flex-1 overflow-x-auto p-2 gap-1"></nav>
  <button onclick="logout()" class="m-3 text-left px-3 py-2 text-sm text-red-600 rounded-lg hover:bg-red-50">⎋ Keluar</button>
 </aside>
 <main id="main" class="flex-1 overflow-y-auto p-4 md:p-8"></main>
</div>

<div id="modal" class="hidden fixed inset-0 z-[100] bg-black/50 flex items-center justify-center p-4">
 <div class="bg-white rounded-xl w-full max-w-md overflow-hidden">
  <div class="px-5 py-3 border-b bg-gray-50 font-bold" id="mt"></div>
  <div class="p-5 space-y-3" id="mb"></div>
  <div class="px-5 py-3 border-t bg-gray-50 flex justify-end gap-2">
   <button onclick="closeM()" class="px-4 py-2 border rounded-lg text-sm">Batal</button>
   <button id="ms" class="btn">Simpan</button></div>
 </div>
</div>

<script>
const mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},
 set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const users=[{email:'admin@sekolah.com',password:'admin',name:'Budi Admin',role:'admin'},{email:'guru@sekolah.com',password:'guru',name:'Siti Guru',role:'guru'}];
let kelas=S.get('kelas',[{id:'k1',nama:'X MIPA 1'},{id:'k2',nama:'X IPS 1'}]);
let siswa=S.get('siswa',[
 {id:'s1',nis:'1001',nama:'Ahmad Fauzi',kelasId:'k1',noWa:'081234567890',ortu:'Bpk. Herman'},
 {id:'s2',nis:'1002',nama:'Bunga Lestari',kelasId:'k1',noWa:'089876543210',ortu:'Ibu Ratna'},
 {id:'s3',nis:'1003',nama:'Candra Wijaya',kelasId:'k2',noWa:'085555555555',ortu:'Bpk. Wijaya'}]);
let riwayat=S.get('riwayat',[]);
let cfg=Object.assign({url:'https://tp4.wapromosi.my.id',apikey:'',sender:'',sekolah:'SMA Negeri 1 Nusantara',tpl:'Yth. Bapak/Ibu [ORTU], ananda [NAMA] (NIS: [NIS], Kelas: [KELAS]) telah HADIR di [SEKOLAH] pada [TANGGAL] pukul [WAKTU]. Terima kasih.'},S.get('cfg',{}));
const MIG={'[Nama Ortu]':'[ORTU]','[Nama Siswa]':'[NAMA]','[Nama Sekolah]':'[SEKOLAH]','[Kelas]':'[KELAS]','[Tanggal]':'[TANGGAL]','[Waktu]':'[WAKTU]'};Object.keys(MIG).forEach(k=>{cfg.tpl=cfg.tpl.split(k).join(MIG[k])});
let logs=[],user=null,view='',tab='siswa',chart=null;
const kn=id=>(kelas.find(k=>k.id===id)||{}).nama||'-';
const today=()=>new Date().toLocaleDateString('id-ID');
function toast(m,t='info'){const e=document.createElement('div');e.className='px-4 py-2 rounded-lg text-white text-sm shadow '+({success:'bg-emerald-500',error:'bg-red-500',info:'bg-blue-500'}[t]);e.textContent=m;$('toast').appendChild(e);setTimeout(()=>e.remove(),3500)}

$('lf').onsubmit=e=>{e.preventDefault();const u=users.find(x=>x.email===$('em').value&&x.password===$('pw').value);
 if(!u)return toast('Email atau password salah.','error');user=u;boot();toast('Selamat datang, '+u.name+'!','success')};
function boot(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');
 $('un').textContent=user.name;$('ur').textContent=user.role==='admin'?'Administrator':'Guru / Operator';
 const items=[['dashboard','📊 Dashboard',['admin']],['scan','🔍 Scan Absensi',['admin','guru']],['rekap','📄 Rekap Absensi',['admin']],['master','🗄 Data Master',['admin']],['settings','💬 Pengaturan WA',['admin']]];
 $('nav').innerHTML=items.filter(i=>i[2].includes(user.role)).map(i=>`<a href="#" data-v="${i[0]}" class="nav whitespace-nowrap block px-3 py-2 rounded-lg text-sm hover:bg-blue-50" onclick="go('${i[0]}');return false">${i[1]}</a>`).join('');
 go(user.role==='admin'?'dashboard':'scan')}
function logout(){user=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
let qr=null,camOn=false,camBusy=false;
function camBtn(on){const b=$('bc');if(!b)return;b.textContent=on?'⏹ Matikan Kamera':'📷 Aktifkan Kamera Scanner';b.className='px-5 py-2.5 rounded-lg text-sm font-semibold border '+(on?'bg-red-50 text-red-600 border-red-200':'bg-blue-50 text-blue-600 border-blue-200')}
async function toggleCam(){camOn?await stopCam():await startCam()}
async function startCam(){const rd=$('reader'),er=$('cerr');if(camBusy)return;
 if(!window.Html5Qrcode){er.textContent='Library scanner belum termuat.';er.classList.remove('hidden');return}
 camBusy=true;er.classList.add('hidden');rd.classList.remove('hidden');$('bc').textContent='Meminta akses kamera...';
 try{qr=qr||new Html5Qrcode('reader');
  await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},txt=>{
   try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=800;o.start();o.stop(c.currentTime+.1)}catch(e){}
   const i=$('si');if(i&&!i.disabled){i.value=txt;window.runScan&&window.runScan(txt)}},()=>{});
  camOn=true;camBtn(true)
 }catch(e){rd.classList.add('hidden');camOn=false;camBtn(false);
  er.textContent='Kamera tidak bisa diakses ('+(e&&e.message||e)+'). Izinkan akses kamera di browser; di preview ini kamera bisa diblokir, jalankan di hosting HTTPS sendiri.';er.classList.remove('hidden')}
 camBusy=false}
async function stopCam(){try{if(qr&&camOn)await qr.stop()}catch(e){}camOn=false;const rd=$('reader');if(rd)rd.classList.add('hidden');camBtn(false)}
function go(v){if(v!=='scan')stopCam();view=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));({dashboard,scan,rekap,master,settings})[v]()}

function dashboard(){
 const t=today(),set=new Set(riwayat.filter(a=>a.tanggal===t).map(a=>a.nis));
 const belum=siswa.filter(s=>!set.has(s.nis));
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 const data=days.map(d=>riwayat.filter(a=>a.tanggal===d.toLocaleDateString('id-ID')).length);
 const card=(l,v,c)=>`<div class="bg-white rounded-xl p-5 shadow-sm border border-l-4 ${c}"><p class="text-sm text-gray-500">${l}</p><p class="text-3xl font-bold">${v}</p></div>`;
 $('main').innerHTML=`<h2 class="text-2xl font-bold mb-5">Dashboard</h2>
 <div class="grid md:grid-cols-3 gap-4 mb-6">${card('Total Siswa',siswa.length,'border-l-blue-500')}${card('Hadir Hari Ini',set.size,'border-l-green-500')}${card('Belum Absen',belum.length,'border-l-red-500')}</div>
 <div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-white rounded-xl border p-4"><h3 class="font-semibold mb-3">Tren Kehadiran 7 Hari Terakhir</h3><div class="h-64"><canvas id="ch"></canvas></div></div>
 <div class="bg-white rounded-xl border overflow-hidden"><div class="p-3 border-b bg-gray-50 font-semibold flex justify-between">Belum Absen Hari Ini<span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded-full">${belum.length} Siswa</span></div>
 <ul class="divide-y max-h-64 overflow-y-auto">${belum.map(s=>`<li class="p-3 text-sm flex justify-between"><span>${s.nama}</span><span class="text-xs bg-gray-100 px-2 rounded">${kn(s.kelasId)}</span></li>`).join('')||'<li class="p-4 text-center text-sm text-green-600">Semua siswa sudah diabsen.</li>'}</ul></div></div>`;
 if(window.Chart){if(chart)chart.destroy();chart=new Chart($('ch'),{type:'line',data:{labels:days.map(d=>d.toLocaleDateString('id-ID',{weekday:'short'})),datasets:[{label:'Hadir',data,borderColor:'#10b981',tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}})}}

function recent(){const r=riwayat.filter(a=>a.tanggal===today()).slice(-15).reverse();
 $('rc').innerHTML=r.map(x=>`<li class="p-3 flex justify-between"><div><div class="text-sm font-semibold">${x.nama}</div><div class="text-[11px] text-gray-500">NIS: ${x.nis} • jam ${x.waktu}</div></div><span class="text-[10px] font-bold px-2 py-1 rounded bg-green-50 text-green-600 h-fit">✓ Hadir</span></li>`).join('')||'<li class="p-4 text-center text-sm text-gray-500">Belum ada absensi hari ini.</li>'}
function scan(){
 $('main').innerHTML=`<div class="max-w-5xl mx-auto grid lg:grid-cols-12 gap-5">
 <div class="lg:col-span-7 bg-white rounded-2xl border overflow-hidden"><div class="p-5 bg-blue-600 text-white text-center"><h2 class="text-2xl font-bold">Scan Barcode / Input NIS</h2><p class="text-blue-100 text-sm">Pastikan kursor berada di kotak input sebelum scan.</p></div>
 <div class="p-6"><div class="flex flex-col items-center mb-4"><button id="bc" onclick="toggleCam()" class="px-5 py-2.5 rounded-lg text-sm font-semibold border bg-blue-50 text-blue-600 border-blue-200">📷 Aktifkan Kamera Scanner</button>
 <div id="reader" class="w-full max-w-sm mt-3 hidden overflow-hidden rounded-xl border-2 border-dashed border-gray-300 bg-black"></div><p id="cerr" class="text-xs text-red-600 mt-2 hidden"></p></div>
 <div class="text-center text-xs text-gray-400 uppercase tracking-wider mb-3">atau ketik</div><input id="si" autocomplete="off" class="inp text-center text-xl font-bold tracking-widest py-4 border-2" placeholder="SCAN / KETIK NIS">
 <p class="text-xs text-gray-400 text-center mt-2">Coba NIS: 1001, 1002, 1003 lalu Enter, atau scan QR/barcode yang berisi NIS.</p>
 <div id="sr" class="mt-5 text-center text-gray-400 py-6">Menunggu input scan...</div></div></div>
 <div class="lg:col-span-5"><h4 class="text-sm font-semibold text-gray-500 mb-2 uppercase">Absensi Terakhir</h4><ul id="rc" class="bg-white rounded-xl border divide-y max-h-[60vh] overflow-y-auto"></ul></div></div>`;
 recent();const i=$('si');i.focus();
 const run=async nis=>{nis=String(nis).trim();if(!nis||i.disabled)return;
  const s=siswa.find(x=>x.nis===nis);
  if(!s){toast('Siswa dengan NIS tersebut tidak ditemukan.','error');i.value='';return}
  i.disabled=true;$('sr').innerHTML=`<div class="text-gray-800 text-left border rounded-xl p-4 bg-slate-50"><div class="text-xl font-bold">${s.nama}</div><div class="text-sm text-gray-500">NIS ${s.nis} • ${kn(s.kelasId)} • WA ${s.noWa}</div><div class="mt-3 text-center p-2 bg-blue-50 text-blue-700 rounded-lg">Memproses Kehadiran & WA...</div></div>`;
  const waktu=new Date().toLocaleTimeString('id-ID'),tanggal=today();
  const ex=riwayat.find(a=>a.nis===nis&&a.tanggal===tanggal);
  if(ex)ex.waktu=waktu;else riwayat.push({nis,nama:s.nama,kelasId:s.kelasId,status:'Hadir',waktu,tanggal,isoDate:new Date().toISOString()});
  S.set('riwayat',riwayat);
  const msg=fillTpl(cfg.tpl,s,tanggal,waktu);
  const r=await kirimWA(s.noWa,msg);
  toast(r.ok?`Hadir: ${s.nama} tersimpan. WA Terkirim.`:`Hadir: ${s.nama} tersimpan. (WA Gagal)`,r.ok?'success':'info');
  recent();setTimeout(()=>{$('sr').textContent='Menunggu input scan...';i.disabled=false;i.value='';i.focus()},1200)};i.onkeydown=e=>{if(e.key==='Enter')run(i.value)};window.runScan=run}

let csp=false;document.addEventListener('securitypolicyviolation',()=>{csp=true});
function fillTpl(t,s,tgl,wkt){const v={NAMA:s.nama,ORTU:s.ortu,NIS:s.nis,KELAS:kn(s.kelasId),SEKOLAH:cfg.sekolah,TANGGAL:tgl,WAKTU:wkt};return t.replace(/\[(NAMA|ORTU|NIS|KELAS|SEKOLAH|TANGGAL|WAKTU)\]/gi,(m,k)=>v[k.toUpperCase()])}
function normNo(n){n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
async function kirimWA(to,pesan){const waktu=new Date().toLocaleTimeString('id-ID'),no=normNo(to);
 const log=(status,res)=>logs.unshift({waktu,to:no||to,status,pesan,res});
 if(!cfg.apikey||!cfg.sender){log('Gagal','API Key / nomor sender (device) belum diisi.');return{ok:false,msg:'API Key / Sender belum diisi'}}
 if(!no){log('Gagal','Nomor WA tujuan kosong.');return{ok:false,msg:'Nomor tujuan kosong'}}
 try{const f=new FormData();f.append('api_key',cfg.apikey);f.append('sender',normNo(cfg.sender));f.append('number',no);f.append('message',pesan);
  csp=false;const r=await fetch(cfg.url.replace(/[/]+$/,'')+'/send-message',{method:'POST',body:f}),t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
  const st=j?String(j.status).toLowerCase():'';
  const ok=j?(st==='true'||st==='1'||st==='success'||(st!=='false'&&st!=='0'&&st!=='error'&&st!=='failed'&&st!=='undefined'&&r.ok)):r.ok;
  log(ok?'Terkirim':'Gagal',t.slice(0,300));return{ok,msg:(j&&(j.msg||j.message))||t.slice(0,100)}
 }catch(e){
  if(!csp){log('Terkirim','Permintaan terkirim ke server, tetapi respons tidak terbaca browser (CORS). Cek WA tujuan untuk memastikan. Detail: '+e.message);return{ok:true,msg:'Terkirim (respons tidak terbaca/CORS)'}}
  log('Error','Diblokir oleh preview (CSP), pesan tidak terkirim: '+e.message);return{ok:false,msg:'Diblokir preview'}}}

const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function matrix(){const k=$('fk').value,b=$('fb').value||new Date().toISOString().slice(0,7);
 const [Y,M]=b.split('-').map(Number),n=new Date(Y,M,0).getDate();
 const hadir={};riwayat.forEach(r=>{const p=String(r.tanggal).split('/').map(Number);if(p[2]===Y&&p[1]===M)(hadir[r.nis]=hadir[r.nis]||new Set()).add(p[0])});
 const list=siswa.filter(s=>k==='all'||s.kelasId===k).sort((x,y)=>x.nama.localeCompare(y.nama));
 return{Y,M,n,list,hadir,k}}
function rekap(){
 $('main').innerHTML=`<div class="flex justify-between items-center mb-5"><h2 class="text-2xl font-bold">Rekap Absensi</h2><button class="btn" style="background:#16a34a" onclick="exportX()">Export ke Excel</button></div>
 <div class="bg-white p-4 rounded-xl border mb-5 flex flex-wrap gap-3"><select id="fk" class="inp w-48" onchange="rows()">${kelas.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('')}<option value="all">Semua Kelas</option></select>
 <input type="month" id="fb" class="inp w-48" value="${new Date().toISOString().slice(0,7)}" onchange="rows()"></div>
 <div id="rh" class="mb-3 text-sm font-semibold"></div>
 <div class="bg-white rounded-xl border overflow-x-auto"><table class="min-w-full text-center border-collapse" id="rt"></table></div>
 <p class="text-xs text-gray-500 mt-2">Keterangan: <b>H</b> = Hadir</p>`;rows()}
function rows(){const m=matrix(),kl=m.k==='all'?'Semua Kelas':kn(m.k);
 $('rh').textContent=`Kelas: ${kl}  |  Bulan: ${BLN[m.M-1]} ${m.Y}`;
 const c='border border-gray-200 px-1.5 py-1.5 text-xs';
 let h=`<thead class="bg-gray-50"><tr><th class="${c} px-2">No</th><th class="${c} text-left px-2">Nama Siswa</th>`;
 for(let d=1;d<=m.n;d++)h+=`<th class="${c}">${d}</th>`;h+=`<th class="${c} px-2 bg-green-50">Total Hadir</th></tr></thead><tbody>`;
 h+=m.list.map((s,i)=>{const set=m.hadir[s.nis]||new Set();let r=`<tr><td class="${c}">${i+1}</td><td class="${c} text-left whitespace-nowrap px-2 font-medium">${s.nama}</td>`;
  for(let d=1;d<=m.n;d++)r+=`<td class="${c} ${set.has(d)?'text-green-600 font-bold bg-green-50':''}">${set.has(d)?'H':''}</td>`;
  return r+`<td class="${c} font-bold bg-green-50">${set.size}</td></tr>`}).join('')||`<tr><td colspan="${m.n+3}" class="p-6 text-gray-500">Tidak ada siswa.</td></tr>`;
 $('rt').innerHTML=h+'</tbody>'}
function exportX(){const m=matrix();if(!m.list.length)return toast('Tidak ada data yang bisa diexport!','error');
 if(!window.XLSX)return toast('Library Excel belum termuat.','error');
 const hd=['No','NIS','Nama Siswa',...Array.from({length:m.n},(_,i)=>i+1),'Total Hadir'];
 const aoa=[[`Kelas: ${m.k==='all'?'Semua Kelas':kn(m.k)}`],[`Bulan: ${BLN[m.M-1]} ${m.Y}`],[],hd,...m.list.map((s,i)=>{const set=m.hadir[s.nis]||new Set();return[i+1,s.nis,s.nama,...Array.from({length:m.n},(_,d)=>set.has(d+1)?'H':''),set.size]})];
 const ws=XLSX.utils.aoa_to_sheet(aoa),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Rekap_Absensi');
 try{XLSX.writeFile(wb,`Rekap_Absensi_${BLN[m.M-1]}_${m.Y}.xlsx`);toast('File Excel diunduh.','success')}catch(e){toast('Unduhan dibatasi di preview.','info')}}

function master(){
 const tb=(id,l)=>`<button onclick="tab='${id}';master()" class="py-3 px-1 border-b-2 text-sm font-medium ${tab===id?'border-blue-500 text-blue-600':'border-transparent text-gray-500'}">${l}</button>`;
 const sis=siswa.map(s=>`<tr><td class="td font-medium">${s.nis}</td><td class="td">${s.nama}</td><td class="td">${kn(s.kelasId)}</td><td class="td font-mono text-gray-500">${s.noWa||'-'}</td><td class="td text-right"><button onclick="fSiswa('${s.id}')" class="px-2 text-blue-600">Edit</button><button onclick="del('siswa','${s.id}')" class="px-2 text-red-600">Hapus</button></td></tr>`).join('');
 const kls=kelas.map(k=>`<tr><td class="td font-mono text-gray-500">${k.id}</td><td class="td font-bold">${k.nama}</td><td class="td">${siswa.filter(s=>s.kelasId===k.id).length} Siswa</td><td class="td text-right"><button onclick="fKelas('${k.id}')" class="px-2 text-blue-600">Edit</button><button onclick="del('kelas','${k.id}')" class="px-2 text-red-600">Hapus</button></td></tr>`).join('');
 $('main').innerHTML=`<div class="flex justify-between items-center mb-4 flex-wrap gap-2"><h2 class="text-2xl font-bold">Data Master</h2><div class="flex gap-2">
 <input type="file" id="xf" accept=".xlsx,.xls,.csv" class="hidden" onchange="impX(event)">
 <button class="btn" style="background:#16a34a" onclick="$('xf').click()">Import Excel</button><button class="btn" onclick="tab==='siswa'?fSiswa():fKelas()">+ Tambah Manual</button></div></div>
 <div class="border-b mb-4 flex gap-6">${tb('siswa','Data Siswa')}${tb('kelas','Data Kelas')}</div>
 <div class="bg-white rounded-xl border overflow-x-auto"><table class="min-w-full divide-y"><thead class="bg-gray-50"><tr>${(tab==='siswa'?['NIS','Nama Lengkap','Kelas','No. WA Ortu','Aksi']:['ID','Nama Kelas','Jumlah Siswa','Aksi']).map(h=>`<th class="th">${h}</th>`).join('')}</tr></thead><tbody class="divide-y">${tab==='siswa'?sis:kls}</tbody></table></div>`}
function openM(t,html,fn){$('mt').textContent=t;$('mb').innerHTML=html;$('ms').onclick=fn;$('modal').classList.remove('hidden')}
function closeM(){$('modal').classList.add('hidden')}
const fld=(id,l,v='')=>`<label class="block text-sm font-medium">${l}<input id="${id}" class="inp mt-1" value="${v}"></label>`;
function fSiswa(id){const s=siswa.find(x=>x.id===id)||{};
 openM(id?'Edit Data Siswa':'Tambah Siswa Baru',fld('fn','NIS *',s.nis||'')+fld('fm','Nama Lengkap *',s.nama||'')+
 `<label class="block text-sm font-medium">Kelas<select id="fc" class="inp mt-1">${kelas.map(k=>`<option value="${k.id}" ${k.id===s.kelasId?'selected':''}>${k.nama}</option>`).join('')}</select></label>`+fld('fw','No WA Orang Tua',s.noWa||'')+fld('fo','Nama Wali / Orang Tua',s.ortu||''),
 ()=>{const d={id:id||'s'+Date.now(),nis:$('fn').value.trim(),nama:$('fm').value.trim(),kelasId:$('fc').value,noWa:$('fw').value.trim(),ortu:$('fo').value.trim()};
  if(!d.nis||!d.nama)return toast('NIS dan Nama wajib diisi!','error');
  const i=siswa.findIndex(x=>x.id===d.id);i>-1?siswa[i]=d:siswa.push(d);S.set('siswa',siswa);closeM();toast('Data siswa berhasil disimpan.','success');master()})}
function fKelas(id){const k=kelas.find(x=>x.id===id)||{};
 openM(id?'Edit Data Kelas':'Tambah Kelas Baru',fld('kn','Nama Kelas *',k.nama||''),()=>{const n=$('kn').value.trim();if(!n)return toast('Nama kelas wajib diisi!','error');
  id?k.nama=n:kelas.push({id:'k'+Date.now(),nama:n});S.set('kelas',kelas);closeM();toast('Data kelas berhasil disimpan.','success');master()})}
function del(t,id){if(t==='siswa'){siswa=siswa.filter(s=>s.id!==id);S.set('siswa',siswa)}
 else{const n=siswa.filter(s=>s.kelasId===id).length;if(n)return toast(`Gagal menghapus. Terdapat ${n} siswa di kelas ini.`,'error');kelas=kelas.filter(k=>k.id!==id);S.set('kelas',kelas)}
 toast('Data berhasil dihapus.','success');master()}
function impX(e){const f=e.target.files[0];if(!f||!window.XLSX)return;const r=new FileReader();
 r.onload=ev=>{try{const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'}),j=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let a=0,u=0;
  j.forEach(w=>{const nis=String(w.NIS||'');if(!nis)return;const k=kelas.find(k=>k.nama.toLowerCase()===String(w.Kelas||'').toLowerCase())||kelas[0];
   const i=siswa.findIndex(s=>s.nis===nis),d={id:i>-1?siswa[i].id:'s'+Date.now()+Math.random(),nis,nama:w.Nama||w.Name||'Tanpa Nama',kelasId:k?k.id:'',noWa:String(w.NoWA||w.WA||w['No WA']||''),ortu:w.Ortu||w['Nama Ortu']||'-'};
   i>-1?(siswa[i]=d,u++):(siswa.push(d),a++)});S.set('siswa',siswa);toast(`${a} siswa baru ditambahkan, ${u} diperbarui.`,'success');master()}
  catch(x){toast('Gagal membaca file.','error')}e.target.value=''};r.readAsArrayBuffer(f)}

function settings(){
 $('main').innerHTML=`<h2 class="text-2xl font-bold mb-5">Pengaturan WhatsApp API</h2><div class="grid lg:grid-cols-2 gap-6">
 <div class="bg-white rounded-xl border p-5 space-y-3"><h3 class="font-medium">Konfigurasi WA Gateway (MPWA)</h3>
 <div class="p-3 bg-blue-50 rounded-lg text-sm text-blue-800">Server: tp4.wapromosi.my.id (MPWA). Login ke dashboard, hubungkan nomor WhatsApp (scan QR) di menu Devices, lalu salin API Key dan nomor device ke kolom di bawah.</div>
 <label class="block text-sm font-medium">URL Server WA Gateway<input id="su" class="inp mt-1" value="${cfg.url}" placeholder="https://tp4.wapromosi.my.id"></label>
 <label class="block text-sm font-medium">API Key<input id="st" type="password" class="inp mt-1" value="${cfg.apikey}" placeholder="API Key dari dashboard"></label>
 <label class="block text-sm font-medium">Nomor Sender / Device (terhubung di gateway)<input id="sn" class="inp mt-1" value="${cfg.sender}" placeholder="628123456789"></label>
 <label class="block text-sm font-medium">Nama Sekolah<input id="ss" class="inp mt-1" value="${cfg.sekolah}"></label>
 <label class="block text-sm font-medium">Template Pesan<textarea id="sp" rows="4" class="inp mt-1">${cfg.tpl}</textarea></label>
 <p class="text-xs bg-gray-50 p-2 rounded border">Variabel: [NAMA] (nama siswa), [ORTU] (nama orang tua), [NIS], [KELAS], [SEKOLAH], [TANGGAL], [WAKTU]</p>
 <div class="flex gap-2 pt-3 border-t flex-wrap"><input id="tn" class="inp flex-1" placeholder="No. WA tes (0812...)"><button class="btn bg-gray-600" style="background:#4b5563" onclick="tes()">Test Kirim</button><button class="btn" onclick="simpan()">Simpan</button></div></div>
 <div class="bg-white rounded-xl border overflow-hidden"><div class="p-3 border-b bg-gray-50 font-medium">Log Notifikasi (Terbaru)</div><ul id="lg" class="divide-y max-h-[30rem] overflow-y-auto"></ul></div></div>`;lg()}
function lg(){$('lg').innerHTML=logs.map(l=>`<li class="p-3"><div class="flex justify-between text-xs"><span class="text-gray-500">${l.waktu}</span><span class="px-2 rounded ${l.status==='Terkirim'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${l.status}</span></div><p class="text-sm font-medium">Kepada: ${l.to}</p><p class="text-xs italic bg-gray-100 p-2 rounded my-1">${l.pesan}</p><p class="text-[10px] text-gray-400 break-words">${l.res}</p></li>`).join('')||'<li class="p-6 text-center text-sm text-gray-500">Belum ada log pengiriman.</li>'}
function simpan(){cfg={url:$('su').value.trim()||'https://tp4.wapromosi.my.id',apikey:$('st').value.trim(),sender:$('sn').value.trim(),sekolah:$('ss').value,tpl:$('sp').value};S.set('cfg',cfg);toast('Pengaturan berhasil disimpan!','success')}
async function tes(){const n=$('tn').value.trim();if(!n)return toast('Masukkan nomor WA tujuan.','error');cfg.url=$('su').value.trim()||cfg.url;cfg.apikey=$('st').value.trim();cfg.sender=$('sn').value.trim();cfg.sekolah=$('ss').value;
 const r=await kirimWA(n,`Ini pesan uji dari sistem absensi ${cfg.sekolah}.`);toast(r.ok?'Berhasil terkirim!':'Gagal: '+r.msg,r.ok?'success':'error');lg()}
</script></body></html>
